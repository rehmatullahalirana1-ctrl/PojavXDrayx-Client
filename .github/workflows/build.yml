name: Build PojavXDrayx Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile Minecraft Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Check project files
        run: |
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          test -f src/main/java/com/pojavxdrayx/client/PojavXDrayxClient.java

      - name: Build client
        run: gradle build --no-daemon --stacktrace

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PojavXDrayx-Client-JAR
          path: build/libs/*.jar
          if-no-files-found: error
