name: Build PojavXDrayx Client

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
name: Compile Minecraft Client
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java 25
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '25'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.7.1'

  - name: Diagnose project files
    run: |
      echo "=== Repository root ==="
      pwd
      echo "=== Files found in repository ==="
      find . -maxdepth 8 -type f \
        -not -path './.git/*' | sort
      echo "=== Checking required files ==="
      for file in \
        build.gradle \
        settings.gradle \
        gradle.properties \
        src/main/resources/fabric.mod.json \
        src/main/java/com/pojavxdrayx/client/PojavXDrayxClient.java
      do
        if [ -f "$file" ]; then
          echo "FOUND: $file"
        else
          echo "MISSING: $file"
        fi
      done

  - name: Build client
    run: gradle build --no-daemon --stacktrace

  - name: Upload compiled JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: PojavXDrayx-Client-JAR
      path: build/libs/*.jar
      if-no-files-found: error
